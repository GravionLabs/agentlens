<span class="end">
  @if (sampleMode) {
    <hx-tag class="sample" severity="warn" value="sample data" rounded />
    <a
      class="demo-link"
      href="https://github.com/GravionLabs/agentlens/releases/latest"
      target="_blank"
      rel="noopener noreferrer"
      >Install the application</a
    >
  }
  <button
    hx-button
    type="button"
    variant="text"
    size="small"
    [title]="
      rounded()
        ? 'Token counts are rounded (2.11 M). Click to show them in full.'
        : 'Token counts are shown in full (2,114,305). Click to round them.'
    "
    aria-label="Round token counts"
    [attr.aria-pressed]="rounded()"
    (click)="toggleRounded()"
  >
    {{ rounded() ? "2.11 M" : "2,114,305" }}
  </button>
  <span class="zoom" role="group" aria-label="Interface size">
    <button
      hx-button
      type="button"
      variant="text"
      size="small"
      title="Smaller (Ctrl -)"
      aria-label="Smaller"
      (click)="zoom.zoomOut()"
    >
      <svg
        class="icon"
        viewBox="0 0 16 16"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="7" cy="7" r="4.5" />
        <path d="M10.5 10.5 14 14M5 7h4" />
      </svg>
    </button>
    <button
      hx-button
      type="button"
      variant="text"
      size="small"
      title="Reset (Ctrl 0)"
      aria-label="Reset size"
      (click)="zoom.reset()"
    >
      {{ percent() }}%
    </button>
    <button
      hx-button
      type="button"
      variant="text"
      size="small"
      title="Larger (Ctrl +)"
      aria-label="Larger"
      (click)="zoom.zoomIn()"
    >
      <svg
        class="icon"
        viewBox="0 0 16 16"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="7" cy="7" r="4.5" />
        <path d="M10.5 10.5 14 14M5 7h4M7 5v4" />
      </svg>
    </button>
  </span>
  @if (!sampleMode) {
    <app-cli-tools />
    <app-update-status />
  }
</span>
