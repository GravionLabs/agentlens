allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# 7 days, in minutes: a younger release reaches neither the lockfile nor an install (GravionLabs/ci#239).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@gravionlabs/helix-shell@22.2.14"
  - "@gravionlabs/helix-ui@22.2.14"
