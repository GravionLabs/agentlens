name: release

# A push to main versions the build with GitVersion (GitVersion.yml), builds the CLI binaries and the
# application installers and publishes one GitHub release tagged v<version>. The jobs live in the shared
# workflow GravionLabs/ci/.github/workflows/tauri-app.yml. Binaries and installers for four targets are
# expensive (macOS and Windows runners), so they are only built when a release branch is merged into
# main, never on a pull request. Run this via workflow_dispatch to validate the matrix on a branch: such a
# run gets a throw-away version (0.0.<run number>) and creates no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A release in progress is never canceled.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: GravionLabs/ci/.github/workflows/tauri-app.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: read
    with:
      # The application crate needs system libraries; app.yml checks it.
      ci-exclude: agentlens-app
      # One archive per target holds the CLI and the MCP server.
      cli-package: agentlens-cli agentlens-mcp
      cli-binary: agentlens agentlens-mcp
      tauri: true
      installer-args: --config src-tauri/tauri.bundle.conf.json
      # The installers also carry the CLI and the MCP server as sidecars (bundle.externalBin in tauri.conf.json);
      # dir must match those paths. The CLI archives are not affected.
      installer-sidecars: '{"package":"agentlens-cli agentlens-mcp","binary":"agentlens agentlens-mcp","dir":"src-tauri/binaries"}'
    # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) sign the update packages the in-app updater verifies (docs/updater.md).
    secrets: inherit
