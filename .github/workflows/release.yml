name: release

# A push to main versions the build with GitVersion (GitVersion.yml), builds the
# CLI binaries and publishes a GitHub release tagged v<version>. Pull requests
# that touch the release files run the build as a dry run without publishing.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "GitVersion.yml"
      - "cliff.toml"

concurrency:
  group: release-${{ github.ref }}
  # A release in progress is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-version:
    name: determine version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  build:
    name: build ${{ matrix.target }}
    needs: determine-version
    runs-on: ${{ matrix.os }}
    env:
      # Builds from other branches are not releases; they get a throw-away version.
      VERSION: ${{ github.ref == 'refs/heads/main' && needs.determine-version.outputs.semver || format('0.0.{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Set the version
        shell: bash
        # The workspace version is the only `version =` at the start of a line.
        run: sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
      - name: Build
        # No --locked: the workspace version changed, so Cargo.lock is refreshed.
        run: cargo build --release -p agentlens-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="agentlens-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/agentlens.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/agentlens" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Smoke test the binary
        shell: bash
        run: |
          bin="agentlens-${{ matrix.target }}/agentlens"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    name: publish release
    needs: [determine-version, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && rm *.sha256
      # The release notes are the changelog entry of this version, made from the
      # conventional commits since the last release (cliff.toml).
      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ needs.determine-version.outputs.semver }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.determine-version.outputs.semver }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ needs.determine-version.outputs.semver }}" \
            --notes-file RELEASE_NOTES.md
