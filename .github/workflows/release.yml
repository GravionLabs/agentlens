name: release

# A push to main versions the build with GitVersion (GitVersion.yml), builds the
# CLI binaries and the application installers and publishes one GitHub release
# tagged v<version>. Pull requests that touch the release files run the builds as
# a dry run without publishing.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "GitVersion.yml"
      - "cliff.toml"
      - "src-tauri/tauri.conf.json"

concurrency:
  group: release-${{ github.ref }}
  # A release in progress is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-version:
    name: determine version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  build:
    name: build ${{ matrix.target }}
    needs: determine-version
    runs-on: ${{ matrix.os }}
    env:
      # Builds from other branches are not releases; they get a throw-away version.
      VERSION: ${{ github.ref == 'refs/heads/main' && needs.determine-version.outputs.semver || format('0.0.{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Set the version
        shell: bash
        # The workspace version is the only `version =` at the start of a line.
        run: sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
      - name: Build
        # No --locked: the workspace version changed, so Cargo.lock is refreshed.
        run: cargo build --release -p agentlens-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="agentlens-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/agentlens.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/agentlens" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Smoke test the binary
        shell: bash
        run: |
          bin="agentlens-${{ matrix.target }}/agentlens"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  installers:
    name: installers ${{ matrix.target }}
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # MSI needs a numeric version, so builds that are not releases get 0.0.<run number>.
      VERSION: ${{ github.ref == 'refs/heads/main' && needs.determine-version.outputs.semver || format('0.0.{0}', github.run_number) }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set the version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargo = fs.readFileSync('Cargo.toml', 'utf8');
            fs.writeFileSync('Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"' + version + '\"'));
          "
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only builds from main create the release, as a draft until the publish job.
          tagName: ${{ github.ref == 'refs/heads/main' && format('v{0}', env.VERSION) || '' }}
          releaseName: ${{ github.ref == 'refs/heads/main' && format('v{0}', env.VERSION) || '' }}
          releaseDraft: true
          args: --target ${{ matrix.target }}

  publish:
    name: publish release
    needs: [determine-version, build, installers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && rm *.sha256
      # The release notes are the changelog entry of this version, made from the
      # conventional commits since the last release (cliff.toml).
      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ needs.determine-version.outputs.semver }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      # The installers job created the draft release; add the CLI binaries and publish it.
      # Release PRs are squash-merged, so main may hold no conventional commits and
      # git-cliff finds nothing. Then the notes are the change lines of the squash
      # commit message (the commits of the release branch).
      - name: Fall back to the squash commit message
        run: |
          if ! grep -q '^### ' RELEASE_NOTES.md; then
            {
              echo "## Changes"
              echo
              git log -1 --format=%b | grep -E '^\* (feat|fix|docs|perf|refactor)' | awk '!seen[$0]++'
            } > RELEASE_NOTES.md
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.determine-version.outputs.semver }}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" dist/* --draft --target "${{ github.sha }}" \
              --title "$tag" --repo "${{ github.repository }}"
          fi
          gh release edit "$tag" --notes-file RELEASE_NOTES.md --draft=false \
            --title "$tag" --repo "${{ github.repository }}"
