name: App

# Checks for the desktop application. On pull requests the `changes` job decides
# from the diff whether the frontend, the Tauri crate or this workflow changed;
# the `app` job always runs last and is the single check to require on a branch
# (it is green when the checks passed or were skipped for lack of app changes).
# The CLI workflow (ci.yml) excludes the app crate and needs no system libraries.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes (app files)
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The Windows installer test runs on manual dispatch and when the installer files change.
          win_pattern='^src-tauri/(windows/.*|tauri\.conf\.json|tauri\.bundle\.conf\.json)$'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            if git diff --name-only "$BEFORE_SHA" HEAD 2>/dev/null | grep -Eq "$win_pattern"; then
              echo "windows=true" >> "$GITHUB_OUTPUT"
            else
              echo "windows=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if grep -Eq "$win_pattern" <(git diff --name-only "$BASE_SHA" HEAD); then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi
          # Same list as the former `paths` filter.
          pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|angular\.json|tsconfig[^/]*\.json|eslint\.config\.mjs|vitest\.[^/]*|src/.*|src-tauri/.*|crates/agentlens-core/.*|\.github/workflows/app\.yml)$'
          git diff --name-only "$BASE_SHA" HEAD > changed.txt
          cat changed.txt
          if grep -Eq "$pattern" changed.txt; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: frontend (lint, format, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  tauri:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: application crate (clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: GravionLabs/ci/rust/setup@main
        with:
          tauri-linux-deps: 'true'
      # The Tauri macros read the built frontend.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # bundle.externalBin: the app crate needs the staged CLI and MCP server at build time.
      - run: scripts/stage-sidecars.sh
      # tests/installer_hooks.rs compiles the NSIS installer hooks with makensis.
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: cargo clippy -p agentlens-app --all-targets -- -D warnings
      - run: cargo test -p agentlens-app
        env:
          AGENTLENS_REQUIRE_MAKENSIS: '1'

  # Installs the NSIS setup against a synthetic user PATH (issue #443).
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: windows installer (user PATH)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/stage-sidecars.ps1
        shell: pwsh
      - run: pnpm tauri build --bundles nsis
      - name: Test the installer against synthetic PATH values
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe, target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'no setup .exe found' }
          src-tauri/windows/test-path.ps1 -Installer $setup.FullName
          exit $LASTEXITCODE

  # The one check to require: green when frontend and tauri passed or were
  # skipped because no app files changed; red when any of them (or `changes`)
  # failed or was cancelled.
  app:
    name: app
    if: always()
    needs: [changes, frontend, tauri, windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended as $r"; exit 1 ;;
            esac
          done
