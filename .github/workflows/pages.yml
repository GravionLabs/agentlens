name: Pages

# One public site on GitHub Pages (docs/adr/0005-documentation-site.md):
#   /       the documentation site: docs/ as a website (site/, VitePress)
#   /app/   the application with its sample data, as a live demo
# Pull requests to main that touch the site, its documents or the application build all of it, so a
# broken link or a broken demo is found before the merge; only main deploys, and only while the
# repository variable DEPLOY_PAGES is "true" (Settings -> Pages -> Source must be "GitHub Actions").
# A manual run builds everything as a dry run and deploys nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "angular.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments queue up behind each other and the last one wins; a pull request replaces its own earlier run.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    # Pull requests and manual runs build as a dry run; only a push to main needs the variable.
    if: github.event_name != 'push' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    env:
      # Every piece knows where it lives: https://<owner>.github.io/<repository>/...
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated glossary and the site tests
        run: pnpm test
      # Dead links in the guide fail this step.
      - name: Build the documentation site
        run: SITE_BASE="$BASE" pnpm docs:build
      - name: Build the application demo
        run: DEMO_BASE="${BASE}app/" pnpm build:demo
      - name: Put the pieces together
        run: pnpm docs:assemble "$RUNNER_TEMP/pages"
      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
