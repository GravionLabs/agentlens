name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows runners cost 10x and 2x a Linux minute: a pull request is checked on
        # Linux only, the full matrix runs once the release branch is merged into main.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # fmt, clippy and tests of the CLI crates; the application crate needs system libraries and is
      # checked in app.yml.
      - uses: GravionLabs/ci/rust/ci@main
        with:
          exclude: agentlens-app
